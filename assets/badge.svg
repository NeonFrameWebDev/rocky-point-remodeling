<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <circle cx="200" cy="200" r="200" fill="#1C1C1C"/>

  <!-- ── House / construction icon ────────────────────────────── -->

  <!-- Stacked horizontal boards at right gable end -->
  <rect x="258" y="68"  width="28" height="7" fill="#D4752A" rx="1"/>
  <rect x="258" y="80"  width="28" height="7" fill="#D4752A" rx="1"/>
  <rect x="258" y="92"  width="28" height="7" fill="#D4752A" rx="1"/>
  <rect x="258" y="104" width="28" height="7" fill="#D4752A" rx="1"/>

  <!-- Roof outline (unfilled triangle) -->
  <polygon points="200,62 280,124 120,124"
    fill="none" stroke="#D4752A" stroke-width="6"
    stroke-linejoin="miter" stroke-linecap="round"/>

  <!-- Rafter lines from peak to eave -->
  <line x1="200" y1="62"  x2="200" y2="124" stroke="#D4752A" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="62"  x2="160" y2="124" stroke="#D4752A" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="62"  x2="240" y2="124" stroke="#D4752A" stroke-width="4" stroke-linecap="round"/>

  <!-- House body -->
  <rect x="128" y="123" width="144" height="62" fill="#D4752A"/>

  <!-- Door cutout -->
  <rect x="182" y="150" width="36" height="35" fill="#1C1C1C"/>

  <!-- ── RPR — orange layer then white on top ──────────────────── -->
  <text x="204" y="241"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="102" font-weight="900"
    fill="#D4752A"
    text-anchor="middle" dominant-baseline="middle">RPR</text>

  <text x="200" y="237"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="102" font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle" dominant-baseline="middle">RPR</text>

  <!-- ── REMODELING ─────────────────────────────────────────────── -->
  <text x="200" y="318"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21" font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle" dominant-baseline="middle"
    letter-spacing="5">REMODELING</text>

</svg>
